<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edeff0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101315" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Plan</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1" aria-live="off"></main>
  <div id="timer" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <nav id="tabs" aria-label="Main">
    <button data-tab="today" aria-label="Today">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8 12.5l2.7 2.7L16.3 9.5"/></svg><span>Today</span>
    </button>
    <button data-tab="lift" aria-label="Lift">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5v5M6.5 7v10M17.5 7v10M21 9.5v5M6.5 12h11"/></svg><span>Lift</span>
    </button>
    <button data-tab="progress" aria-label="Progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5l5-6 3.5 3 7.5-9"/><path d="M15 6.5h4.5V11"/></svg><span>Progress</span>
    </button>
    <button data-tab="more" aria-label="More">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>More</span>
    </button>
  </nav>
</div>
<div id="sheet-root"></div>
<input type="file" id="importfile" accept="application/json,.json" hidden>
<input type="file" id="planfile" accept="application/json,.json" hidden>
<noscript>This app needs JavaScript.</noscript>
<script src="plan.js"></script>
<script src="plan-loader.js"></script>
<script src="lib.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
